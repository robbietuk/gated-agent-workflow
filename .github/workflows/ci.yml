name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make ci
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          make ci
